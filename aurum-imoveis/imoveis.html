<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Imóveis | AURUM</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="cabecalho">
    <div class="container cabecalho-conteudo">
      <div class="logo">
        <span class="logo-name">AURUM</span>
        <span class="logo-subtitulo">Imóveis de Alto Padrão</span>
      </div>
      <nav class="navegacao">
        <a href="index.html">Início</a>
        <a href="imoveis.html" class="ativo">Imóveis</a>
        <a href="index.html#contato">Contato</a>
      </nav>
    </div>
  </header>

  <main>

    <section class="topo-pagina">
      <div class="container">
        <p class="caminho-pagina"><a href="index.html">Início</a> / Imóveis</p>
        <h1>Catálogo de Imóveis</h1>
        <p>Explore nossa seleção de residências exclusivas.</p>
      </div>
    </section>

    <div class="container">
      <div class="barra-filtros">
        <div class="grupo-filtro">
          <label for="f-type">Tipo</label>
          <select id="f-type">
            <option value="todos">Todos</option>
            <option value="casas">Mansões &amp; Casas</option>
            <option value="penthouses">Casas nas Florestas</option>
            <option value="apartamentos">Apartamentos</option>
            <option value="campo">Campo &amp; Fazendas</option>
          </select>
        </div>
        <div class="grupo-filtro">
          <label for="f-location">Cidade</label>
          <select id="f-location">
            <option value="todos">Todas</option>
            <option value="sp">São Paulo</option>
            <option value="rj">Rio de Janeiro</option>
            <option value="campo">Interior SP</option>
          </select>
        </div>
        <div class="grupo-filtro">
          <label for="f-price">Preço</label>
          <select id="f-price">
            <option value="todos">Qualquer</option>
            <option value="ate20">Até R$ 20 Mi</option>
            <option value="20a30">R$ 20 a 30 Mi</option>
            <option value="acima30">Acima R$ 30 Mi</option>
          </select>
        </div>
        <div class="grupo-filtro">
          <label for="f-sort">Ordenar por</label>
          <select id="f-sort">
            <option value="padrao">Relevância</option>
            <option value="menor-preco">Menor Preço</option>
            <option value="maior-preco">Maior Preço</option>
            <option value="maior-area">Maior Área</option>
          </select>
        </div>
        <div class="grupo-filtro">
          <label>&nbsp;</label>
          <button id="btn-reset" class="botao-contorno">Limpar</button>
        </div>
      </div>

      <div class="busca-filtro">
        <input type="text" id="buscar" placeholder="Buscar por nome, bairro ou características...">
      </div>

      <p id="resultando" class="contador-resultados">Carregando...</p>

      <div class="grade-cartoes" id="catalog-grid" style="margin-bottom:60px;">
      </div>
    </div>

  </main>

  <footer class="rodape">
    <div class="container rodape-conteudo">
      <span><strong>AURUM</strong> Imóveis de Alto Padrão &copy; 2026</span>
      <span>LTDA &nbsp;|&nbsp; +55 (62) 99527-ZK3441</span>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
